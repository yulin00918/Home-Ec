<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>十元大作戰｜決策紀錄單</title><style>
*{box-sizing:border-box} body{margin:0;background:#f4efe4;color:#26352f;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.page{width:min(1120px,calc(100% - 32px));margin:28px auto;background:#fffaf0;border:1px solid #d8c8a9;border-radius:24px;padding:34px;box-shadow:0 10px 30px rgba(60,50,30,.08)}
.kicker{font-size:13px;font-weight:900;letter-spacing:.12em;color:#826633}.title{font-family:"Noto Serif TC","Microsoft JhengHei",serif;font-size:36px;margin:8px 0}.lead{line-height:1.8;color:#5b625d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}.card{border:1px solid #d8c8a9;border-radius:18px;padding:18px;background:#fff}.n{font-weight:900;color:#826633}.q{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4f0e7;font-weight:700}
.footer{margin-top:24px;border-top:1px solid #ded4c1;padding-top:14px;font-size:12px;color:#6e706d;display:flex;justify-content:space-between}
@media(max-width:720px){.grid{grid-template-columns:1fr}.page{padding:22px}.title{font-size:29px}}
@media print{body{background:#fff}.page{box-shadow:none;margin:0;width:100%;border:none}.no-print{display:none}}
button{font:inherit}

.row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #ded4c1} .blank{min-height:52px;border:1px dashed #b8aa8c;border-radius:12px;background:#fff}
.alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .box{padding:16px;border:1px solid #d8c8a9;border-radius:14px;text-align:center;background:#fff}
</style><body><main class="page"><div class="kicker">FINANCIAL QUEST｜學生紀錄</div>
<h1 class="title">💰 十元大作戰｜我的決策歷程</h1><p class="lead">沒有標準比例。先做你現在的選擇，再看看條件改變後，你會不會重新決定。</p>
<h2>① 第一次，我怎麼分？</h2><div class="alloc"><div class="box">消費<br>＿＿ 元</div><div class="box">儲蓄<br>＿＿ 元</div><div class="box">投資<br>＿＿ 元</div></div>
<div class="row"><strong>② 發生什麼事？</strong><div class="blank"></div></div>
<div class="row"><strong>③ 我改不改？</strong><div><label>□ 維持原決定　□ 我要調整</label><div class="blank" style="margin-top:10px"></div></div></div>
<div class="row"><strong>④ 為什麼？</strong><div class="blank"></div></div>
<div class="row"><strong>⑤ 再看一次</strong><div><p>如果現在再選一次，我最想改變的是：</p><div class="blank"></div></div></div>
<div class="footer"><span>張鈺聆 製</span><span>學習不在第一次答案，而在條件改變後的再決定。</span></div></main></body></html>
