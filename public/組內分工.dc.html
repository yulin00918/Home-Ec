<html>
<head>

<meta name="author" content="張鈺聆">
<meta name="copyright" content="© 張鈺聆">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  .gt-input{box-sizing:border-box;}
</style>
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;color:#26304a;background:linear-gradient(180deg, #a9cbea 0%, #c9d5ef 24%, #e0cbe6 50%, #f0c9d8 75%, #ddc6e6 100%);min-height:100vh;padding:20px;">
  <div style="width:min(1180px,100%);margin:0 auto;">
    <a href="教學百寶箱.dc.html" style="display:inline-block;margin-bottom:14px;color:#6b4fc4;font-weight:700;text-decoration:none;white-space:nowrap;">← 回教學百寶箱</a>

    <header style="text-align:center;margin-bottom:18px;">
      <h1 style="margin:0 0 6px;font-size:clamp(28px,5vw,44px);">👥 小組任務分工器</h1>
      <p style="margin:0;color:#6f7890;">隨機分組 × 角色分工 × 任務清楚</p>
    </header>

    <sc-if value="{{ presentationMode }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;margin-bottom:16px;">
        <button onClick="{{ togglePresentation }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#4650cc;">⬅ 返回設定</button>
      </div>
    </sc-if>

    <sc-if value="{{ !presentationMode }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:16px;">

        <section style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;">
          <div style="font-weight:900;margin-bottom:10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;">
            <span>① 輸入學生名單</span>
            <button onClick="{{ loadFromRoster }}" style="border:1px solid #5b67f1;background:#fff;color:#5b67f1;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;">📥 從學生名單載入</button>
          </div>
          <textarea class="gt-input" value="{{ studentsText }}" onChange="{{ onStudentsChange }}" placeholder="每行輸入一位學生，例如：&#10;王小明&#10;陳小華&#10;林小美&#10;張小安" style="width:100%;height:160px;padding:11px 12px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;resize:vertical;line-height:1.6;font:inherit;font-size:14px;"></textarea>
          <div style="margin-top:8px;font-size:13px;color:#6f7890;">目前 {{ studentCount }} 位學生</div>
        </section>

        <section style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;">
          <div style="font-weight:900;margin-bottom:10px;font-size:16px;">② 設定分組方式</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">
            <div>
              <label style="display:block;font-size:13px;color:#6f7890;margin-bottom:5px;">每組人數</label>
              <select class="gt-input" value="{{ groupSize }}" onChange="{{ onGroupSizeChange }}" style="width:100%;padding:11px 12px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;font:inherit;font-size:14px;">
                <option value="2">2 人</option>
                <option value="3">3 人</option>
                <option value="4">4 人</option>
                <option value="5">5 人</option>
                <option value="6">6 人</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:13px;color:#6f7890;margin-bottom:5px;">角色分配</label>
              <select class="gt-input" value="{{ roleMode }}" onChange="{{ onRoleModeChange }}" style="width:100%;padding:11px 12px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;font:inherit;font-size:14px;">
                <option value="order">依角色順序分配</option>
                <option value="random">隨機分配角色</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">
            <button onClick="{{ makeGroups }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg, #8b5cf6, #a78bfa);color:#fff;">🎲 隨機分組＋分工</button>
            <button onClick="{{ rerollRoles }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#4650cc;">🔄 保留分組，只換角色</button>
            <button onClick="{{ togglePresentation }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#f7f8fc;color:#6f7890;">🖥️ 投影模式</button>
          </div>
        </section>

        <section style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;">
          <div style="font-weight:900;margin-bottom:6px;font-size:16px;">③ 小組角色設定</div>
          <p style="color:#6f7890;font-size:13px;line-height:1.7;margin:0 0 12px;">角色名稱與工作都可以修改。4 人組使用前 4 個角色，5 人組使用前 5 個，6 人組使用全部角色。</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <sc-for list="{{ roles }}" as="role" hint-placeholder-count="6">
              <div style="display:grid;grid-template-columns:46px 1fr 1.4fr 44px;gap:8px;align-items:center;">
                <input class="gt-input" value="{{ role.icon }}" onChange="{{ role.onIconChange }}" maxlength="4" style="text-align:center;padding:8px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;font:inherit;">
                <input class="gt-input" value="{{ role.name }}" onChange="{{ role.onNameChange }}" placeholder="角色名稱" style="padding:8px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;font:inherit;">
                <input class="gt-input" value="{{ role.job }}" onChange="{{ role.onJobChange }}" placeholder="角色工作內容" style="padding:8px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;font:inherit;">
                <button onClick="{{ role.onRemove }}" style="border:0;border-radius:12px;padding:8px;font:inherit;font-weight:800;cursor:pointer;background:#ffe8eb;color:#e45d68;" title="刪除角色">×</button>
              </div>
            </sc-for>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
            <button onClick="{{ addRole }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#4650cc;">＋ 新增角色</button>
            <button onClick="{{ resetRoles }}" style="border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#f7f8fc;color:#6f7890;">↺ 恢復預設角色</button>
          </div>
        </section>
      </div>
    </sc-if>

    <section style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;margin-top:16px;">
      <div style="font-weight:900;margin-bottom:10px;font-size:16px;">小組分工結果</div>
      <sc-if value="{{ hasGroups }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;">
          <sc-for list="{{ groups }}" as="group" hint-placeholder-count="0">
            <div style="background:#f7f5fe;border-radius:16px;overflow:hidden;">
              <div style="padding:11px 16px;font-size:16px;font-weight:900;background:#8b5cf6;color:#fff;">第 {{ group.index }} 組</div>
              <sc-for list="{{ group.members }}" as="m" hint-placeholder-count="0">
                <div style="padding:12px 16px;border-top:1px solid #e6e1fa;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:20px;">{{ m.icon }}</span>
                    <span style="font-size:15px;font-weight:800;">{{ m.name }}</span>
                    <span style="margin-left:auto;background:#eef0ff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#4650cc;white-space:nowrap;">{{ m.roleName }}</span>
                  </div>
                  <div style="color:#6f7890;font-size:13px;line-height:1.6;margin-top:5px;">{{ m.roleJob }}</div>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ !hasGroups }}" hint-placeholder-val="{{ true }}">
        <div style="text-align:center;padding:36px 16px;color:#a3abc2;">輸入學生名單後，按下「隨機分組＋分工」</div>
      </sc-if>
    </section>
  </div>
</div>

<div style="position:fixed;right:10px;bottom:8px;z-index:9999;pointer-events:none;font:500 12px/1.4 system-ui,'Noto Sans TC',sans-serif;color:rgba(80,60,45,.45);letter-spacing:.02em;">張鈺聆 製</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const DEFAULT_ROLES = [
  { icon: '📋', name: '任務召集員', job: '確認任務內容、邀請每位組員參與，整合意見並確認工作完成。' },
  { icon: '🔍', name: '討論分析員', job: '閱讀資料、找出重點、分析問題，提出理由與可能的解決方法。' },
  { icon: '📝', name: '紀錄整理員', job: '記錄小組討論、答案、數據與重要決定，整理小組成果。' },
  { icon: '🗣️', name: '成果報告員', job: '代表小組說明成果、回答問題，清楚表達小組的想法與理由。' },
  { icon: '⏱️', name: '時間進度員', job: '掌握活動時間、提醒剩餘時間與進度，協助小組準時完成任務。' },
  { icon: '📦', name: '器材材料員', job: '負責領取、管理、整理與歸還學習單、器材、材料、卡牌或設備。' }
];

class Component extends DCLogic {
  state = {
    studentsText: localStorage.getItem('groupToolStudents') || '',
    roles: JSON.parse(localStorage.getItem('groupToolRoles') || 'null') || JSON.parse(JSON.stringify(DEFAULT_ROLES)),
    groupSize: 4,
    roleMode: 'order',
    currentGroups: [],
    presentationMode: false
  };

  getStudents() {
    return [...new Set(this.state.studentsText.split(/\n|,|，/).map(x => x.trim()).filter(Boolean))];
  }

  loadRosterInfo() {
    try {
      const cd = JSON.parse(localStorage.getItem('teacherToolboxClassData') || 'null');
      if (cd && cd.students && cd.students.length) return cd;
    } catch (e) {}
    return null;
  }

  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  saveRoles(roles) {
    localStorage.setItem('groupToolRoles', JSON.stringify(roles));
  }

  makeGroups = () => {
    const students = this.getStudents();
    if (students.length < 2) { alert('請至少輸入 2 位學生。'); return; }
    const groupSize = this.state.groupSize;
    const shuffled = this.shuffle(students);
    const groupCount = Math.ceil(shuffled.length / groupSize);
    const groups = Array.from({ length: groupCount }, () => []);
    shuffled.forEach((student, i) => groups[i % groupCount].push(student));
    this.setState({ currentGroups: groups }, () => this.assignRoles(false));
  };

  rerollRoles = () => {
    if (!this.state.currentGroups.length) { alert('請先完成分組。'); return; }
    this.assignRoles(true);
  };

  assignRoles(forceRandom) {
    const roles = this.state.roles;
    if (!roles.length) { alert('請至少設定一個角色。'); return; }
    const mode = this.state.roleMode;
    this.setState({
      resultGroups: this.state.currentGroups.map((group, gi) => {
        let avail = roles.slice(0, Math.max(group.length, 1));
        while (avail.length < group.length) avail = avail.concat(roles);
        avail = avail.slice(0, group.length);
        if (mode === 'random' || forceRandom) avail = this.shuffle(avail);
        return {
          index: gi + 1,
          members: group.map((student, mi) => ({ name: student, icon: avail[mi].icon, roleName: avail[mi].name, roleJob: avail[mi].job }))
        };
      })
    });
  }

  onStudentsChange = (e) => {
    const val = e.target.value;
    localStorage.setItem('groupToolStudents', val);
    this.setState({ studentsText: val });
  };
  onGroupSizeChange = (e) => this.setState({ groupSize: Number(e.target.value) });
  onRoleModeChange = (e) => this.setState({ roleMode: e.target.value });

  updateRole(index, key, value) {
    const roles = this.state.roles.map((r, i) => i === index ? { ...r, [key]: value } : r);
    this.saveRoles(roles);
    this.setState({ roles });
  }

  addRole = () => {
    const roles = [...this.state.roles, { icon: '⭐', name: '自訂角色', job: '請輸入這個角色的工作內容。' }];
    this.saveRoles(roles);
    this.setState({ roles });
  };

  removeRole(index) {
    if (this.state.roles.length <= 1) { alert('至少需要保留一個角色。'); return; }
    const roles = this.state.roles.filter((_, i) => i !== index);
    this.saveRoles(roles);
    this.setState({ roles });
  }

  resetRoles = () => {
    if (!confirm('確定恢復預設角色嗎？')) return;
    const roles = JSON.parse(JSON.stringify(DEFAULT_ROLES));
    this.saveRoles(roles);
    this.setState({ roles });
  };

  togglePresentation = () => this.setState(s => ({ presentationMode: !s.presentationMode }));

  renderVals() {
    const roles = this.state.roles.map((r, i) => ({
      ...r,
      onIconChange: (e) => this.updateRole(i, 'icon', e.target.value),
      onNameChange: (e) => this.updateRole(i, 'name', e.target.value),
      onJobChange: (e) => this.updateRole(i, 'job', e.target.value),
      onRemove: () => this.removeRole(i)
    }));
    const groups = this.state.resultGroups || [];
    return {
      studentsText: this.state.studentsText,
      studentCount: this.getStudents().length,
      groupSize: String(this.state.groupSize),
      roleMode: this.state.roleMode,
      roles,
      onStudentsChange: this.onStudentsChange,
      loadFromRoster: () => {
        const cd = this.loadRosterInfo();
        if (!cd) { alert('尚未建立學生名單，請先至教學百寶箱的「學生名單」匯入'); return; }
        const text = cd.students.map(s => s.name).filter(Boolean).join('\n');
        this.setState({ studentsText: text });
        localStorage.setItem('groupToolStudents', text);
      },
      onGroupSizeChange: this.onGroupSizeChange,
      onRoleModeChange: this.onRoleModeChange,
      makeGroups: this.makeGroups,
      rerollRoles: this.rerollRoles,
      addRole: this.addRole,
      resetRoles: this.resetRoles,
      togglePresentation: this.togglePresentation,
      presentationMode: this.state.presentationMode,
      hasGroups: groups.length > 0,
      groups
    };
  }
}

</script>
</body>
</html>
