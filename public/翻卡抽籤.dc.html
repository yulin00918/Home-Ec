<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @keyframes cardPop { from { transform: scale(0.85) rotate(-4deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes cardSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(1080deg); } }
  .fk-input{box-sizing:border-box;}
</style>
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;color:#26304a;background:radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 28%),radial-gradient(circle at 90% 15%, rgba(160,190,255,.8), transparent 30%),linear-gradient(135deg, #dce6fb, #eef2fd);min-height:100vh;padding:20px;">
  <div style="width:min(1180px,100%);margin:0 auto;">
    <a href="教學百寶箱.dc.html" style="display:inline-block;margin-bottom:14px;color:#4650cc;font-weight:700;text-decoration:none;white-space:nowrap;">← 回教學百寶箱</a>

    <header style="text-align:center;margin-bottom:18px;">
      <h1 style="margin:0 0 6px;font-size:clamp(28px,5vw,44px);">♠ 翻卡抽籤</h1>
      <p style="margin:0;color:#6f7890;">輸入卡片內容，洗牌後隨機抽出任務、事件或題目。</p>
    </header>

    <div style="display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:16px;">

      <aside style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;display:flex;flex-direction:column;gap:16px;">
        <div>
          <label style="display:block;font-weight:900;margin-bottom:6px;font-size:14px;">卡片內容（一行一張）</label>
          <textarea class="fk-input" value="{{ cardText }}" onChange="{{ onCardTextChange }}" placeholder="例如：&#10;朋友生日，花費 300 元&#10;手機突然故障&#10;獲得額外零用錢 500 元&#10;投資獲利 10%&#10;遇到網路詐騙" style="width:100%;min-height:190px;padding:11px 12px;border:1px solid #dfe4f2;border-radius:12px;background:#fff;resize:vertical;line-height:1.7;font:inherit;font-size:14px;"></textarea>
          <div style="margin-top:8px;text-align:right;font-size:12px;color:#6f7890;">已輸入 <strong>{{ inputCount }}</strong> 張卡片</div>
        </div>

        <div>
          <label style="display:block;font-weight:900;margin-bottom:8px;font-size:14px;">一次抽幾張？</label>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;">
            <sc-for list="{{ countOptions }}" as="opt" hint-placeholder-count="4">
              <button onClick="{{ opt.onSelect }}" style="{{ opt.style }}">{{ opt.value }}</button>
            </sc-for>
          </div>
        </div>

        <div>
          <label style="display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;">
            <span style="font-size:14px;font-weight:700;">抽過的卡片不再出現</span>
            <input type="checkbox" checked="{{ removeDrawn }}" onChange="{{ onToggleRemoveDrawn }}" style="width:20px;height:20px;accent-color:#5b67f1;flex:none;">
          </label>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
          <button onClick="{{ loadSample }}" style="border:0;border-radius:12px;padding:11px 13px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#4650cc;">載入範例</button>
          <button onClick="{{ clearCards }}" style="border:0;border-radius:12px;padding:11px 13px;font:inherit;font-weight:800;cursor:pointer;background:#f7f8fc;color:#6f7890;">清空</button>
        </div>
      </aside>

      <main style="background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:20px;min-height:520px;display:flex;flex-direction:column;align-items:center;">
        <div style="display:flex;justify-content:center;gap:60px;padding-bottom:21px;border-bottom:1px solid #e5e9f5;width:100%;">
          <div style="text-align:center;">
            <strong style="display:block;font-size:28px;font-weight:900;color:#5b67f1;">{{ remainingCount }}</strong>
            <span style="color:#6f7890;font-size:12px;">剩餘卡片</span>
          </div>
          <div style="text-align:center;">
            <strong style="display:block;font-size:28px;font-weight:900;color:#e45d9a;">{{ drawnTotal }}</strong>
            <span style="color:#6f7890;font-size:12px;">已抽出</span>
          </div>
        </div>

        <div style="min-height:300px;display:flex;align-items:center;justify-content:center;padding:32px 0;gap:16px;flex-wrap:wrap;">
          <sc-if value="{{ isDrawing }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ spinnerSlots }}" as="slot" hint-placeholder-count="0">
              <div style="width:150px;height:210px;display:flex;align-items:center;justify-content:center;border-radius:18px;background-image:radial-gradient(circle, rgba(255,255,255,.3) 1.5px, transparent 1.6px), linear-gradient(150deg, #5b67f1, #7f86ff);background-size:18px 18px, 100% 100%;color:#fff;font-size:44px;box-shadow:0 12px 30px rgba(66,77,140,.25);animation:cardSpin 0.8s linear infinite;">♠</div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ hasDrawnCards }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ drawnCards }}" as="c" hint-placeholder-count="0">
              <div style="width:190px;height:260px;border-radius:18px;background:{{ c.bg }};border:2px solid {{ c.border }};box-shadow:0 12px 30px rgba(66,77,140,.18);display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;text-align:center;position:relative;animation:cardPop 0.4s ease-out;">
                <span style="position:absolute;top:10px;left:12px;font-size:14px;opacity:0.55;">✦</span>
                <span style="font-size:20px;font-weight:800;line-height:1.6;overflow-wrap:anywhere;color:{{ c.text_color }};">{{ c.text }}</span>
                <span style="position:absolute;bottom:10px;right:12px;font-size:14px;opacity:0.55;">✦</span>
              </div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
            <div style="text-align:center;color:#6f7890;">
              <div style="width:150px;height:210px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;border-radius:18px;background-image:radial-gradient(circle, rgba(255,255,255,.3) 1.5px, transparent 1.6px), linear-gradient(150deg, #5b67f1, #7f86ff);background-size:18px 18px, 100% 100%;color:#fff;font-size:44px;box-shadow:0 12px 30px rgba(66,77,140,.25);">♠</div>
              <p style="margin:0;font-size:13px;">尚未開始抽卡</p>
            </div>
          </sc-if>
        </div>

        <div style="display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;">
          <button onClick="{{ drawCard }}" style="border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg, #5b67f1, #7f86ff);color:#fff;min-width:150px;white-space:nowrap;opacity:{{ drawBtnOpacity }};" disabled="{{ isDrawing }}">＋ 開始抽卡</button>
          <button onClick="{{ resetDeck }}" style="border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:#f7f8fc;color:#6f7890;white-space:nowrap;">↻ 重新洗牌</button>
        </div>
        <p style="min-height:21px;margin:13px 0 0;text-align:center;color:#6f7890;font-size:12px;">{{ message }}</p>
      </main>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    cardText: '',
    drawCount: 1,
    removeDrawn: true,
    originalCards: [],
    remainingCards: [],
    drawnTotal: 0,
    drawnCards: [],
    message: '',
    isDrawing: false
  };

  getCardsFromInput() {
    return this.state.cardText.split('\n').map(c => c.trim()).filter(Boolean);
  }

  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  initialiseDeck() {
    const cards = this.getCardsFromInput();
    this.setState({ originalCards: cards, remainingCards: [...cards], drawnTotal: 0 });
    return cards;
  }

  onCardTextChange = (e) => this.setState({ cardText: e.target.value });
  onToggleRemoveDrawn = () => {
    this.setState(s => ({ removeDrawn: !s.removeDrawn }), () => {
      this.initialiseDeck();
      this.setState({ message: this.state.removeDrawn ? '已開啟不重複抽卡。' : '已開啟可重複抽卡。' });
    });
  };

  drawCard = () => {
    if (this.state.isDrawing) return;
    const currentInput = this.getCardsFromInput();
    let original = this.state.originalCards;
    let remaining = this.state.remainingCards;
    if (JSON.stringify(currentInput) !== JSON.stringify(original)) {
      original = currentInput;
      remaining = [...currentInput];
    }
    if (original.length === 0) { this.setState({ message: '請先輸入至少一張卡片內容。' }); return; }
    const sourceDeck = this.state.removeDrawn ? remaining : original;
    if (sourceDeck.length === 0) { this.setState({ message: '所有卡片都已抽完，請按「重新洗牌」。', originalCards: original, remainingCards: remaining }); return; }
    const requested = this.state.drawCount;
    this.setState({ originalCards: original, remainingCards: remaining, isDrawing: true, drawnCards: [], message: '' });
    setTimeout(() => {
      const shuffled = this.shuffle(sourceDeck);
      const actualCount = Math.min(requested, shuffled.length);
      const selected = shuffled.slice(0, actualCount);
      const newRemaining = [...remaining];
      if (this.state.removeDrawn) {
        selected.forEach(card => {
          const idx = newRemaining.indexOf(card);
          if (idx > -1) newRemaining.splice(idx, 1);
        });
      }
      this.setState({
        remainingCards: newRemaining,
        drawnTotal: this.state.drawnTotal + selected.length,
        drawnCards: selected.map(text => ({ text })),
        isDrawing: false,
        message: actualCount < requested ? `剩餘卡片不足，本次抽出 ${actualCount} 張。` : `本次抽出 ${actualCount} 張卡片！`
      });
    }, 800);
  };

  resetDeck = () => {
    this.initialiseDeck();
    this.setState({ drawnCards: [], message: '牌庫已重置。' });
  };

  loadSample = () => {
    const sample = ['朋友生日，需要準備一份禮物', '手機突然故障，需要支付維修費', '獲得額外零用錢 500 元', '看到限時優惠商品，你會購買嗎？', '朋友推薦一項高報酬投資', '收到「帳戶異常」的陌生簡訊', '投資市場突然大幅下跌', '本月比預期多存下 300 元', '家中臨時需要一筆支出', '發現自己想買的商品正在特價'].join('\n');
    this.setState({ cardText: sample }, () => {
      this.initialiseDeck();
      this.setState({ message: '已載入 10 張示範卡片。' });
    });
  };

  clearCards = () => {
    this.setState({ cardText: '', originalCards: [], remainingCards: [], drawnTotal: 0, drawnCards: [], message: '' });
  };

  renderVals() {
    const countOptions = [1, 2, 3, 4, 5].map(n => ({
      value: n,
      onSelect: () => this.setState({ drawCount: n }),
      style: `border:0;border-radius:10px;padding:10px 0;font:inherit;font-weight:800;cursor:pointer;background:${this.state.drawCount === n ? 'linear-gradient(135deg, #5b67f1, #7f86ff)' : '#f7f8fc'};color:${this.state.drawCount === n ? '#fff' : '#6f7890'};`
    }));
    return {
      cardText: this.state.cardText,
      inputCount: this.getCardsFromInput().length,
      onCardTextChange: this.onCardTextChange,
      countOptions,
      removeDrawn: this.state.removeDrawn,
      onToggleRemoveDrawn: this.onToggleRemoveDrawn,
      loadSample: this.loadSample,
      clearCards: this.clearCards,
      remainingCount: this.state.removeDrawn ? this.state.remainingCards.length : this.state.originalCards.length,
      drawnTotal: this.state.drawnTotal,
      isDrawing: this.state.isDrawing,
      drawBtnOpacity: this.state.isDrawing ? 0.65 : 1,
      spinnerSlots: Array.from({ length: this.state.drawCount }, (_, i) => i),
      hasDrawnCards: !this.state.isDrawing && this.state.drawnCards.length > 0,
      isIdle: !this.state.isDrawing && this.state.drawnCards.length === 0,
      drawnCards: this.state.drawnCards.map((c, i) => {
        const palette = [
          { bg: '#eef0ff', border: '#c7cdfa', text_color: '#33399e' },
          { bg: '#ffe8f4', border: '#f7c3e0', text_color: '#a13a76' }
        ];
        return { ...c, ...palette[i % 2] };
      }),
      drawCard: this.drawCard,
      resetDeck: this.resetDeck,
      message: this.state.message
    };
  }
}

</script>
</body>
</html>
