<title>認識我的身形</title>
<style>
:root{--bg1:#fff8f0;--bg2:#f6f0ff;--pink:#f0a8b8;--ink:#4a3f3a;--muted:#8a7a72;--card:#ffffff;--line:#f0e3da;}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif,Noto Color Emoji;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
.wrap{width:min(760px,94vw);margin:auto;padding:28px 0 70px}
button{font:inherit;cursor:pointer;border:none}
h1,h2,h3{margin:0}
.back{display:block;text-align:center;color:var(--pink);text-decoration:none;font-weight:700;margin-bottom:14px}
.card{background:var(--card);border-radius:26px;box-shadow:0 16px 40px #7b5a4a12;padding:26px;margin-bottom:22px}
.card h2{font-size:24px}
.muted{color:var(--muted);line-height:1.8}
.kind-note{margin:14px auto 0;max-width:460px;padding:10px 14px;border-radius:14px;background:#fff3e0;color:#8a6a3a;font-size:13.5px;line-height:1.7;font-weight:650}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.field{background:#fbfaf8;border:1.5px solid var(--line);border-radius:18px;padding:14px}
.field label{display:block;font-weight:700;margin-bottom:5px}
.field small{color:#a4938b;line-height:1.6}
.field .row{display:flex;margin-top:8px}
.field input{width:100%;border:1px solid #d9ccc6;border-right:0;border-radius:12px 0 0 12px;padding:10px 12px;font-size:16px}
.field .unit{display:flex;align-items:center;padding:0 12px;border:1px solid #d9ccc6;border-radius:0 12px 12px 0;background:#f0e9e6;font-weight:700}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{padding:12px 22px;border-radius:999px;font-weight:800;font-size:15px}
.btn-primary{background:linear-gradient(135deg,var(--pink),#e88fa4);color:white;box-shadow:0 8px 18px #e88fa444}
.sex-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px;font-weight:800;color:#6d5a52}
.sex-btn{padding:9px 20px;border-radius:999px;font-weight:800;font-size:15px;background:#fff;color:#6d5a52;border:2px solid #eadbd5;cursor:pointer}
.sex-btn.on{background:#e88fa4;color:#fff;border-color:#e88fa4}
.btn-ghost{background:#f2e9e6;color:#6d5a52}
.result{margin-top:18px;padding:24px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#fff6ef,#f5f3ff)}
.result .emoji{font-size:52px}
.result h3{font-size:26px;margin:6px 0}
.err{color:#bb4f4f;text-align:center;font-weight:700;margin-top:12px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap"><script src="bigscreen.js" defer></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="服裝與織品.dc.html">← 回服裝與織品</a>
  <div class="card">
    <h2>① 認識我的身形</h2>
    <p class="muted">📏 請以公分（cm）輸入。測量時自然站立，不刻意縮小腹。每個部位建議<strong>量兩次取平均</strong>，結果會更準確。</p>
    <div class="sex-row" id="sexRow">
      <span>性別：</span>
      <button type="button" class="sex-btn" data-sex="boy" onclick="pickSex('boy')">👦 男生</button>
      <button type="button" class="sex-btn" data-sex="girl" onclick="pickSex('girl')">👧 女生</button>
    </div>
    <div class="field-grid" id="fieldGrid"></div>
    <div class="btnrow">
      <button class="btn btn-primary" onclick="judgeBodyType()">判斷我的體型</button>
      <button class="btn btn-ghost" onclick="resetBodyInputs()">重新輸入</button>
    </div>
    <div id="bodyErr"></div>
    <div id="bodyResultBox"></div>
  </div>
</div>

<script>
const FIELDS=[
  {key:'shoulder',label:'肩寬',hint:'背部左肩骨外端點到右肩骨外端點。',ph:'例如 38'},
  {key:'chest',label:'胸圍',hint:'水平繞過胸部最豐滿處一周。',ph:'例如 84'},
  {key:'waist',label:'腰圍',hint:'水平繞過腰部最細處一周。',ph:'例如 68'},
  {key:'hip',label:'臀圍',hint:'水平繞過臀部最豐滿處一周。',ph:'例如 90'}
];
const $=s=>document.querySelector(s);
let saved = {};
try{ saved = JSON.parse(localStorage.getItem('bodyMeasurements')||'{}'); }catch(e){}

function pickSex(v){ saved.sex=v; renderSex(); $('#bodyErr').innerHTML=''; $('#bodyResultBox').innerHTML=''; }
function renderSex(){ document.querySelectorAll('.sex-btn').forEach(b=>b.classList.toggle('on', b.dataset.sex===saved.sex)); }
function renderFields(){
  $('#fieldGrid').innerHTML = FIELDS.map(f=>`
    <div class="field">
      <label>${f.label}</label>
      <small>${f.hint}</small>
      <div class="row">
        <input type="number" min="1" step="0.1" placeholder="${f.ph}" id="bf-${f.key}" value="${saved[f.key]||''}">
        <span class="unit">cm</span>
      </div>
    </div>`).join('');
}
function readBodyInputs(){
  const vals={sex:saved.sex||''};
  FIELDS.forEach(f=>{ const el=$('#bf-'+f.key); if(el) vals[f.key]=el.value; });
  return vals;
}
function resetBodyInputs(){
  saved={}; localStorage.removeItem('bodyMeasurements'); localStorage.removeItem('bodyTypeResult');
  $('#bodyErr').innerHTML=''; $('#bodyResultBox').innerHTML=''; renderFields(); renderSex();
}

/* ---------- 體型判斷公式（依原版 Flash「8-1-3」還原：男女分開判斷） ----------
   原版用到的四個數字：肩寬、胸圍、腰圍、臀圍
   d1 = 臀圍 − 胸圍　d2 = 臀圍÷2 − 肩寬　d3 = 胸圍 − 腰圍　d4 = 臀圍 − 腰圍　d5 = 胸圍 − 臀圍 */
const BODY_RULES = {
  boy:  { hipChest:2, hipChestBig:9,  pear:2, straw:10, silkMin:15, silkMax:22, peanutHW:23, peanutCH:2, kiwi:77, last:{ type:'竹竿型', emoji:'🎋', alias:'和女生的「魚板型」是同一種身形' } },
  girl: { hipChest:2, hipChestBig:10, pear:3, straw:23, silkMin:18, silkMax:22, peanutHW:24, peanutCH:1, kiwi:70, last:{ type:'魚板型', emoji:'🐟', alias:'' } }
};
/* 原版 Flash 的絲瓜型上限（22）寫法有誤、實際上沒有作用：臀圍−腰圍 ≥ 15（男）／18（女）就算絲瓜型。
   這裡完全照原版 Flash 實際跑出的結果（false）。改成 true 則是絲瓜型只到 22。
   註：依原版公式，花生型的條件一定也會先符合草莓型，所以原版判斷不出花生型。 */
const SILK_USE_MAX = false;
const TYPE_INFO = {
  pear:   { type:'西洋梨型', emoji:'🍐', alias:'' },
  silk:   { type:'絲瓜型',   emoji:'🥒', alias:'' },
  straw:  { type:'草莓型',   emoji:'🍓', alias:'' },
  peanut: { type:'花生型',   emoji:'🥜', alias:'又名可樂型' },
  kiwi:   { type:'奇異果型', emoji:'🥝', alias:'又名水蜜桃型' }
};
function determineBodyType(shoulder, chest, waist, hip, sex) {
  const R = BODY_RULES[sex];
  const d1 = hip - chest, d2 = hip / 2 - shoulder, d3 = chest - waist, d4 = hip - waist, d5 = chest - hip;
  const isSilk = d4 >= R.silkMin && (!SILK_USE_MAX || d4 <= R.silkMax);
  const rest = () => {                       // 花生 → 奇異果 → 最後一型（竹竿／魚板）
    if (d4 >= R.peanutHW) {
      if (d5 >= R.peanutCH) return TYPE_INFO.peanut;
      return waist >= R.kiwi ? TYPE_INFO.kiwi : R.last;
    }
    return waist >= R.kiwi ? TYPE_INFO.kiwi : R.last;
  };
  if (d1 >= R.hipChest) {
    if (d1 >= R.hipChestBig && d2 >= R.pear) return TYPE_INFO.pear;
    if (isSilk) return TYPE_INFO.silk;
    return rest();
  }
  if (d3 >= R.straw) return TYPE_INFO.straw;
  if (isSilk) return TYPE_INFO.silk;
  return rest();
}

function judgeBodyType(){
  const vals = readBodyInputs();
  if(!vals.sex){
    $('#bodyErr').innerHTML = `<p class="err">請先選擇性別（男生和女生的判斷標準不同）。</p>`;
    $('#bodyResultBox').innerHTML='';
    return;
  }
  const nums = ['shoulder','chest','waist','hip'].map(k=>parseFloat(vals[k]));
  if(nums.some(v=>Number.isNaN(v)||v<=0)){
    $('#bodyErr').innerHTML = `<p class="err">請先把四個測量數值都正確填寫完成。</p>`;
    $('#bodyResultBox').innerHTML='';
    return;
  }
  $('#bodyErr').innerHTML='';
  saved = vals;
  localStorage.setItem('bodyMeasurements', JSON.stringify(vals));
  const [s,c,w,h]=nums;
  const answer = determineBodyType(s,c,w,h,vals.sex);
  const dataText = `${vals.sex==='boy'?'男生':'女生'} ｜ 肩寬 ${s.toFixed(1)} cm ｜ 胸圍 ${c.toFixed(1)} cm ｜ 腰圍 ${w.toFixed(1)} cm ｜ 臀圍 ${h.toFixed(1)} cm`;
  const result = { type:answer.type, emoji:answer.emoji, alias:answer.alias, dataText, sex:vals.sex };
  localStorage.setItem('bodyTypeResult', JSON.stringify(result));
  showBodyResult(result);
}
function showBodyResult(r){
  $('#bodyResultBox').innerHTML = `
    <div class="result">
      <div class="emoji">${r.emoji}</div>
      <div class="muted">你的身形比較接近</div>
      <h3>${r.type}</h3>
      <p class="muted">${r.alias||''}</p>
      <div style="margin:14px auto 0;max-width:460px;background:#ffffffc0;border-radius:14px;padding:10px 14px;color:#74645f;font-size:13px;">${r.dataText}</div>
      <div class="kind-note">💡 這是簡化的分類，用來認識適合自己的穿搭技巧。每一種身形都沒有好壞，喜歡自己、穿得自在最重要！</div>
    </div>`;
}

renderFields(); renderSex();
try{
  const r = JSON.parse(localStorage.getItem('bodyTypeResult')||'null');
  if(r && r.sex) showBodyResult(r);   // 舊版（沒有分性別）的結果不再顯示
}catch(e){}
</script>
<div style="position:fixed;right:10px;bottom:8px;z-index:9999;pointer-events:none;font:500 12px/1.4 system-ui,'Noto Sans TC',sans-serif;color:rgba(80,60,45,.45);letter-spacing:.02em;">張鈺聆 製</div>
</body>
</html>
